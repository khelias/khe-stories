<!DOCTYPE html>
<html lang="et" data-room="stories" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Unejänku</title>
  <meta name="description" content="Unejutud jänkuperest, ette loetud.">
  <!-- stories-head -->
  <meta name="apple-mobile-web-app-title" content="Unejänku">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#0b0f1d">
  <!-- site-view -->
  <link rel="stylesheet" href="./shell.css">
  <link rel="stylesheet" href="./stories.css">
  <script type="module" src="./main.ts"></script>
</head>
<body class="stories-page" data-view="library">
  <div class="library-sky" aria-hidden="true"><img src="./art/night.svg" alt="" decoding="async"></div>
  <!-- site-header -->

  <main class="stories-app">
    <section class="library" aria-labelledby="series-title">
      <div class="hero" data-hero></div>
      <h1 class="library-title" id="series-title" lang="et">Jänkujutud</h1>
      <div class="cards" data-cards></div>
      <p class="library-note" data-i18n="more">Uusi jutte tuleb siia aegamööda.</p>
    </section>

    <article class="story" aria-labelledby="story-title">
      <div class="story-picture" aria-hidden="true" data-story-picture></div>
      <div class="story-veil" aria-hidden="true"></div>
      <div class="story-bar">
        <a class="glass-button story-back" href="./" aria-label="Jänkujutud" data-i18n-aria="back" data-story-close>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
        </a>
        <span class="story-bar-title" lang="et" aria-hidden="true" data-story-title></span>
        <span class="story-save" data-story-save hidden>
          <button class="glass-button story-save-button" type="button" aria-pressed="false" data-save-button>
            <svg class="icon-save" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v10.5M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>
            <svg class="icon-saved" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
            <span class="visually-hidden" data-save-label>Hoia telefonis</span>
          </button>
        </span>
        <button class="glass-button story-sleep-button" type="button" aria-label="Unetaimer" aria-haspopup="dialog" data-i18n-aria="sleepTimer" data-sleep-open>
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 14.6A7.8 7.8 0 0 1 9.4 4.5a7.8 7.8 0 1 0 10.1 10.1z"/></svg>
        </button>
      </div>
      <p class="story-save-error" role="status" data-i18n="saveFailed" data-save-error hidden>Salvestamine ei õnnestunud.</p>

      <div class="story-main">
        <div class="story-side">
          <div class="story-cover" aria-hidden="true" data-player-tile></div>
          <header class="story-head">
            <h2 id="story-title" lang="et" data-story-title></h2>
            <div class="story-start">
              <button class="pill" type="button" data-story-play>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.3 0-1.7L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/></svg>
                <span data-story-play-label>Kuula</span>
              </button>
              <p class="story-start-meta"><span data-story-length></span><br><span data-i18n="aiVoice">Ette loeb tehisintellekti hääl.</span></p>
            </div>
            <p class="story-no-reading" data-i18n="noReading" data-story-no-reading hidden>Ettelugemist praegu ei ole.</p>
          </header>

          <section class="dock" aria-label="Mängija" data-i18n-aria="playerLabel" data-player>
            <div class="dock-track">
              <span class="dock-fill" data-player-fill></span>
              <input class="dock-seek" type="range" min="0" max="1" step="1" value="0" aria-label="Koht jutus" data-i18n-aria="seek" data-player-seek>
            </div>
            <div class="dock-times">
              <span data-player-elapsed>0:00</span>
              <span data-player-left></span>
            </div>
            <div class="dock-controls">
              <button class="dock-skip" type="button" aria-label="15 sekundit tagasi" data-i18n-aria="back15" data-player-skip="-15">
                <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="stroke" d="M8.6 9.4A10.6 10.6 0 1 1 5.6 17"/><path class="stroke" d="M8.4 3.8v5.9h5.9"/><text x="16.4" y="20.6">15</text></svg>
              </button>
              <button class="dock-play" type="button" aria-label="Kuula" data-player-play>
                <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.3 0-1.7L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/></svg>
                <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>
              </button>
              <button class="dock-skip" type="button" aria-label="15 sekundit edasi" data-i18n-aria="forward15" data-player-skip="15">
                <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path class="stroke" d="M23.4 9.4A10.6 10.6 0 1 0 26.4 17"/><path class="stroke" d="M23.6 3.8v5.9h-5.9"/><text x="15.6" y="20.6">15</text></svg>
              </button>
            </div>
            <p class="dock-ai" data-i18n="aiVoice">Ette loeb tehisintellekti hääl.</p>
          </section>
        </div>

        <div class="story-text" lang="et" data-story-text></div>
      </div>
    </article>
  </main>

  <div class="mini" data-mini hidden>
    <a class="mini-link" href="#" data-mini-link>
      <span class="mini-art" aria-hidden="true" data-mini-art></span>
      <span class="mini-names">
        <span class="mini-title" lang="et" data-story-title></span>
        <span class="mini-time" data-mini-time></span>
      </span>
    </a>
    <button class="mini-play" type="button" aria-label="Kuula" data-player-play>
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10.6-6.8c.6-.4.6-1.3 0-1.7L9.6 4.3C8.9 3.9 8 4.4 8 5.2z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="4.5" width="4.2" height="15" rx="1.4"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.4"/></svg>
    </button>
  </div>

  <dialog class="sleep-sheet" aria-labelledby="sleep-title" data-sleep-sheet>
    <h2 id="sleep-title" data-i18n="sleepTimer">Unetaimer</h2>
    <div class="sleep-options" role="radiogroup" aria-labelledby="sleep-title">
      <button type="button" role="radio" aria-checked="true" data-sleep-count="1"><span data-i18n="sleepAfter1">Pärast seda juttu</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button type="button" role="radio" aria-checked="false" data-sleep-count="2"><span data-i18n="sleepAfter2">Pärast kahte juttu</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      <button type="button" role="radio" aria-checked="false" data-sleep-count="3"><span data-i18n="sleepAfter3">Pärast kolme juttu</span><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
    <div class="sleep-options">
      <button type="button" role="switch" aria-checked="false" data-sleep-dim><span data-i18n="sleepDim">Ekraan tumeneb tasapisi</span><i class="switch" aria-hidden="true"></i></button>
    </div>
    <p class="sleep-note" data-i18n="sleepNote">Kui viimane jutt saab läbi, jääb mängija vaikseks.</p>
  </dialog>

  <div class="dim" aria-hidden="true" data-dim hidden></div>
  <audio preload="metadata" data-story-audio></audio>

  <!-- site-footer -->
</body>
</html>
